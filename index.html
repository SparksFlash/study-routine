<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Study Routine</title>
  <meta name="description" content="My daily study routine: what to do now, today's timeline, weekly timetable and monthly roadmap topics.">
  <meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-now" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-today" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></symbol>
      <symbol id="i-week" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 3v3M16 3v3M8 13h.01M12 13h.01M16 13h.01M8 16.5h.01M12 16.5h.01"/></symbol>
      <symbol id="i-month" viewBox="0 0 24 24"><path d="M12 7c-2-1.6-4.6-2.2-8-2v13c3.4-.2 6 .4 8 2 2-1.6 4.6-2.2 8-2V5c-3.4-.2-6 .4-8 2z"/><path d="M12 7v13"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.2 2.2-5.3 3.6-7.3.4 1.7 1.2 2.8 2.4 3.4-.1-2.9 1-5.6 3.4-7.9.3 3 1.6 4.8 2.8 6.6 1 1.4 1.8 2.9 1.8 5.1 0 3.7-3.1 6.3-7.5 6.3z"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-cup" viewBox="0 0 24 24"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9zM17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3.5v2.5M12 3.5v2.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 3v3M16 3v3M9 15l2 2 4-4"/></symbol>
      <symbol id="i-data" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></symbol>
      <symbol id="i-school" viewBox="0 0 24 24"><path d="M2.5 9L12 4.5 21.5 9 12 13.5 2.5 9zM6.5 11v5c1.5 1.5 3.4 2.2 5.5 2.2s4-.7 5.5-2.2v-5M21.5 9v5"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6L13 3z"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".6"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <p class="eyebrow" id="greet">Study Routine</p>
        <h1 class="brand" id="date-line">Study Routine</h1>
      </div>
      <div class="clock" aria-live="off">
        <span class="clock-time" id="clock-time">--:--</span>
        <span class="clock-zone">Dhaka</span>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="screen-now" class="screen" aria-label="Now"></section>
    <section id="screen-today" class="screen" aria-label="Today" hidden></section>
    <section id="screen-week" class="screen" aria-label="Week" hidden></section>
    <section id="screen-month" class="screen" aria-label="This month" hidden></section>
    <section id="screen-settings" class="screen" aria-label="Settings" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Screens">
    <div class="tabbar-inner">
      <button type="button" data-screen="now"><svg class="ico" aria-hidden="true"><use href="#i-now"/></svg><span>Now</span></button>
      <button type="button" data-screen="today"><svg class="ico" aria-hidden="true"><use href="#i-today"/></svg><span>Today</span></button>
      <button type="button" data-screen="week"><svg class="ico" aria-hidden="true"><use href="#i-week"/></svg><span>Week</span></button>
      <button type="button" data-screen="month"><svg class="ico" aria-hidden="true"><use href="#i-month"/></svg><span>Month</span></button>
      <button type="button" data-screen="settings"><svg class="ico" aria-hidden="true"><use href="#i-settings"/></svg><span>Settings</span></button>
    </div>
  </nav>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form" method="dialog" novalidate>
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 id="editor-title">Edit block</h2>
      <p class="muted small" id="editor-note"></p>
      <div class="row2">
        <label>Start<input type="time" name="start" required></label>
        <label>End<input type="time" name="end" required></label>
      </div>
      <fieldset class="days">
        <legend>Weekdays</legend>
        <div class="daypicks" id="editor-days"></div>
      </fieldset>
      <label>Lane<select name="lane" id="editor-lane"></select></label>
      <label>Title<input type="text" name="title" required maxlength="120"></label>
      <label>Details<textarea name="details" rows="3" maxlength="500"></textarea></label>
      <label class="check"><input type="checkbox" name="optional"> Optional (doesn't count toward the streak)</label>
      <div class="msg error" id="editor-errors" role="alert"></div>
      <div class="msg warn" id="editor-warn" aria-live="polite"></div>
      <div class="dup" id="editor-dup" hidden>
        <p class="small">Copy this block to:</p>
        <div class="daypicks" id="editor-dup-days"></div>
        <button type="button" class="btn" id="editor-dup-go">Create copy</button>
      </div>
      <div class="actions">
        <button type="submit" class="btn primary" value="save" id="editor-save">Save</button>
        <button type="button" class="btn" id="editor-dup-toggle">Duplicate to other days</button>
        <button type="button" class="btn danger" id="editor-delete">Delete</button>
        <button type="button" class="btn ghost" id="editor-cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
